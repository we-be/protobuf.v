syntax = "proto3";

package bench;

option go_package = "example.com/pbbench/bench";

enum PhoneType {
  PHONE_TYPE_UNSPECIFIED = 0;
  PHONE_TYPE_MOBILE = 1;
  PHONE_TYPE_HOME = 2;
  PHONE_TYPE_WORK = 3;
}

message PhoneNumber {
  string number = 1;
  PhoneType type = 2;
}

message Person {
  string name = 1;
  int32 id = 2;
  string email = 3;
  repeated PhoneNumber phones = 4;
  bool active = 5;
  double score = 6;
  uint64 last_seen = 7;
  repeated int64 tags = 8;
  map<string, string> metadata = 9;
  map<int32, int64> counters = 10;
}

message AddressBook {
  repeated Person people = 1;
}
