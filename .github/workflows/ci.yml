name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # master only. A stable-release leg is worth having, but V 0.5.2 cannot
    # bootstrap on current runners (duplicate C.open decl in vlib/os), so it
    # is red on every OS regardless of our code — restore it once a release
    # builds again.
    # setup-v drops the whole V toolchain into the workspace root, and
    # v fmt/test recurse — keep our tree in a subdir so they never meet
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      # a tarball install has no .git, so this prints a bare version with no
      # commit — check the setup-v step's download URL to identify the build
      - name: V version
        run: v version

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # interop harness and example import the module by name
      - name: Link module into vmodules
        run: |
          mkdir -p ~/.vmodules
          ln -s "$PWD" ~/.vmodules/protobuf

      # vfmt switched to the v3 formatter backend upstream (vlang/v#28176,
      # 2026-08-28) and is still growing features back: it re-expands
      # single-line match arms, drops struct field-comment alignment, and
      # emits `fn(` in fn type declarations. V's own vlib does not pass
      # `v fmt -verify` under it either, so reformatting our tree to match
      # would churn every file to satisfy a formatter that is still moving.
      # Advisory until upstream has vlib formatted with it — then reformat
      # once, in its own commit, and make this blocking again.
      - name: Check formatting
        run: v fmt -verify .
        continue-on-error: true

      - name: Unit + fuzz tests
        run: v test .

      - name: Interop oracle vs protoc
        run: ./interop/run.sh 150 1

      - name: Build example
        run: v examples/addressbook

      # keep the release-time benchmark harness from rotting
      - name: Build bench harness
        run: v -o /tmp/pbbench-v bench/v

  # full V-vs-Go benchmark with per-op regression gates. Runner hardware
  # is too noisy for absolute numbers, but V and Go run back-to-back on
  # the same box so the V/Go ratio is stable. Baselines differ by
  # hardware: on desktop cores (Zen 2, even pinned to 4 CPUs) V wins
  # every cell, but on these Azure vCPUs allocation-heavy decode trails
  # Go. Thresholds sit above the runner baselines with headroom; the goal
  # is catching relative regressions (the one real one we have had was
  # +40 percent wall time, far past either gate).
  #
  # The decode threshold was 1.9 until 2026-09-03, when vlang/v#28293 made
  # `int` 64-bit and V's decode got materially slower on the same runners:
  # 86 B decode went 686 -> 1427 ns/op (ratio 0.91 -> 2.27), 15.5 KB 0.77
  # -> 1.50, 1.6 MB 0.91 -> 1.28, while encode was flat-to-faster. That is
  # a toolchain change, not ours — our only decode edit was an i32 cast
  # measured at no cost, and it is not allocation/GC (a -gc none build is
  # identical). Re-baselined to 2.8 so the gate still blocks a real +40
  # percent regression on top of the new normal; tighten it again when
  # upstream decode recovers.
  perf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup V
        uses: vlang/setup-v@v1
        with:
          check-latest: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Link module into vmodules
        run: |
          mkdir -p ~/.vmodules
          ln -s "$PWD" ~/.vmodules/protobuf

      - name: Benchmark with regression gate
        run: MAX_ENCODE_RATIO=1.1 MAX_DECODE_RATIO=2.8 ./bench/run.sh /tmp/bench-results.md

      # to the job summary and the step log, so the runner's V/Go ratios
      # are visible without opening the summary page
      - name: Publish benchmark table
        if: always()
        run: cat /tmp/bench-results.md | tee -a "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat /tmp/bench-results.md || true
