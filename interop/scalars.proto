// Interop oracle schema: every proto3 scalar type plus repeated,
// nested, and enum fields. Used by run.sh to cross-validate the V
// runtime against protoc byte-for-byte.
syntax = "proto3";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

message Nested {
  string name = 1;
  int32 num = 2;
}

message Scalars {
  int32 a = 1;
  int64 b = 2;
  uint32 c = 3;
  uint64 d = 4;
  sint32 e = 5;
  sint64 f = 6;
  bool g = 7;
  string h = 8;
  bytes i = 9;
  float j = 10;
  double k = 11;
  fixed32 l = 12;
  fixed64 m = 13;
  sfixed32 n = 14;
  sfixed64 o = 15;
  Color p = 16;
  repeated int32 rp = 17;
  repeated string rs = 18;
  Nested nested = 19;
  repeated Nested rn = 20;
}
